<!DOCTYPE html>
<html lang="ru-RU">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Страница не найдена — KL STUDIO</title>
<link rel="icon" href="/wp-content/uploads/2024/10/cropped-clue-svgrepo-com.png" sizes="32x32" />
<link rel="stylesheet" href="https://fonts-api.wp.com/css?family=Lato:400,600|Heebo:300,400&display=swap" />
<style>
	:root {
		--bg: #4a4744;
		--fg: #ffffff;
		--muted: rgba(255, 255, 255, .72);
		--accent: #c89b6a;
	}

	* { box-sizing: border-box; }

	body {
		margin: 0;
		min-height: 100vh;
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		gap: 28px;
		padding: 48px 24px;
		background: var(--bg);
		color: var(--fg);
		font-family: Heebo, Lato, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
		text-align: center;
	}

	.brand {
		font-size: 22px;
		font-weight: 600;
		letter-spacing: .12em;
		text-transform: uppercase;
	}

	h1 {
		margin: 0;
		font-family: "Times New Roman", Georgia, serif;
		font-size: clamp(32px, 7vw, 64px);
		font-weight: 400;
		letter-spacing: .04em;
		text-transform: uppercase;
	}

	.rule {
		width: 130px;
		height: 2px;
		background: var(--accent);
	}

	p {
		margin: 0;
		max-width: 34rem;
		color: var(--muted);
		font-size: 17px;
		line-height: 1.6;
	}

	a.home {
		display: inline-block;
		margin-top: 6px;
		padding: 16px 38px;
		border: 1px solid rgba(255, 255, 255, .55);
		color: var(--fg);
		font-size: 13px;
		letter-spacing: .18em;
		text-decoration: none;
		text-transform: uppercase;
		transition: background-color .3s, border-color .3s, color .3s;
	}

	a.home:hover,
	a.home:focus-visible {
		background: var(--fg);
		border-color: var(--fg);
		color: var(--bg);
	}
</style>
</head>
<body>
	<div class="brand">KL Studio</div>
	<h1>Страница не найдена</h1>
	<div class="rule"></div>
	<p>Возможно, страница была удалена или в адресе допущена опечатка. Вернитесь на главную — там есть всё о наших услугах и контакты для связи.</p>
	<a class="home" href="/">На главную</a>
</body>
</html>
